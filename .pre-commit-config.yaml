repos:
  - repo: local
    hooks:
      - id: java-compile
        name: Java compile
        entry: mvn -q -f backend/pom.xml -DskipTests compile
        language: system
        files: ^backend/src/.*\.java$
        pass_filenames: false
      - id: frontend-lint
        name: frontend lint
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/(src|.*\.(json|mts|ts|tsx))
        pass_filenames: false
      - id: secret-scan
        name: secret scan (sk-/jina_/api_key)
        entry: bash -c 'git diff --cached | grep -iE "sk-[a-z0-9]{20}|jina_[a-z0-9]{20}|api_key.*[:=].*[a-z0-9]{20}" && echo "❌ 疑似密钥!" && exit 1 || exit 0'
        language: system
        pass_filenames: false
