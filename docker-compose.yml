# Agent Drive 服务编排（预留参考，生产未使用）
# 生产部署 = systemd API + 独立任务 Worker + nginx 13311 + frontend/out 静态托管
# - db/redis：M3 语义索引规模化时的候选；backend 目前【不读取】DATABASE_URL/REDIS_URL
# - backend/frontend 镜像：历史产物，未随最新架构维护
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agentdrive
    volumes:
      - pgdata:/var/lib/postgresql/data
    # M3 语义索引启用时再开端口映射（宿主 5432 已占用）
    # ports:
    #   - "5432:5432"

  redis:
    image: redis:7-alpine
    # M3 启用时再开端口映射
    # ports:
    #   - "6379:6379"

  backend:
    build:
      context: ./backend
      network: host
      args:
        http_proxy: ${HTTP_PROXY:-http://127.0.0.1:7890}
        https_proxy: ${HTTPS_PROXY:-http://127.0.0.1:7890}
    # 备用容器形态仍由 API 内嵌任务 Worker；生产使用 deploy/ 下的双 service。
    # depends_on: [db, redis]
    environment:
      DATABASE_URL: postgresql+asyncpg://agent:agent@db:5432/agentdrive
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend/data:/app/data
      - ./backend/system:/app/system
    network_mode: host  # 共享宿主网络：容器内 LLM/embedding 调用直连外网

  frontend:
    build:
      context: ./frontend
      network: host
      args:
        http_proxy: ${HTTP_PROXY:-http://127.0.0.1:7890}
        https_proxy: ${HTTPS_PROXY:-http://127.0.0.1:7890}
    depends_on: [backend]
    extra_hosts:
      - "host.docker.internal:host-gateway"  # nginx 经此反代到 host 网络的 backend
    ports:
      - "5173:80"

volumes:
  pgdata:
