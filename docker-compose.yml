# Agent Drive 服务编排（M2 起使用：PostgreSQL + Redis）
# M1 单机跑：backend (uvicorn) + frontend (vite dev) 即可
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agentdrive
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    depends_on: [db, redis]
    environment:
      DATABASE_URL: postgresql+asyncpg://agent:agent@db:5432/agentdrive
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend/data:/app/data
      - ./backend/system:/app/system
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports:
      - "5173:80"

volumes:
  pgdata:
