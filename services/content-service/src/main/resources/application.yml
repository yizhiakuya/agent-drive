spring:
  application:
    name: agent-drive-content-service
  codec:
    max-in-memory-size: ${CONTENT_MAX_REQUEST_BYTES:83886080}B

server:
  address: ${CONTENT_BIND_ADDRESS:127.0.0.1}
  port: ${CONTENT_PORT:8010}

content:
  internal-token: ${CONTENT_INTERNAL_TOKEN:}
  provider: ${CONTENT_PROVIDER:openai_compat}
  base-url: ${CONTENT_VISION_BASE_URL:}
  model: ${CONTENT_VISION_MODEL:}
  api-key: ${CONTENT_VISION_API_KEY:}
  max-images: ${CONTENT_MAX_IMAGES:4}
  max-image-bytes: ${CONTENT_MAX_IMAGE_BYTES:10485760}
  max-response-bytes: ${CONTENT_MAX_RESPONSE_BYTES:2097152}
  max-request-bytes: ${CONTENT_MAX_REQUEST_BYTES:83886080}
