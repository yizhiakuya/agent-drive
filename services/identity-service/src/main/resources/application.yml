spring:
  application:
    name: agent-drive-identity-service
  sql:
    init:
      mode: always
  datasource:
    url: ${IDENTITY_DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/agent_drive_identity}
    username: ${IDENTITY_DATABASE_USERNAME:agent_drive}
    password: ${IDENTITY_DATABASE_PASSWORD:}

server:
  address: ${IDENTITY_BIND_ADDRESS:127.0.0.1}
  port: ${IDENTITY_PORT:8030}

identity:
  internal-token: ${IDENTITY_INTERNAL_TOKEN:}
