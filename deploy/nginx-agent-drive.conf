# Agent Drive HTTPS 入口（家宽自定义端口 13311）
server {
    listen 13311 ssl;
    server_name home.rainaki.top *.rainaki.top;

    ssl_certificate /etc/nginx/certs/rainaki.pem;
    ssl_certificate_key /etc/nginx/certs/rainaki.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # 安全响应头（PWA/HTTPS 环境）
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 200m;  # 大文件上传（分享/上传）

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;            # SSE 流式必需
        proxy_read_timeout 300s;        # 长任务（Agent 多步执行）
        proxy_request_buffering off;
    }
}
