name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check app/

      - name: Type check (mypy, non-blocking)
        run: 'mypy app/ || echo "mypy: 渐进收敛中（13 项已知）"'
        continue-on-error: true

      - name: Integration tests (pytest)
        run: python -m pytest tests/integration -q

      - name: Unit tests (pytest: auth/devices/upload-index/storage/ingest)
        run: python -m pytest tests/unit -q

      - name: Unit test suites (legacy scripts)
        run: |
          for t in test_agent test_critic test_reliability test_retry \
                   test_compress test_write_tools test_memory test_bugfixes; do
            echo "== $t =="
            python tests/unit/$t.py || exit 1
          done

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (vitest)
        run: npm test

      - name: Build
        run: npm run build
