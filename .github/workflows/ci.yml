name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: agent_drive
          POSTGRES_USER: agent_drive
          POSTGRES_PASSWORD: agent_drive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_drive -d agent_drive"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Java tests with PostgreSQL integration
        env:
          AGENT_DRIVE_DATABASE_URL: jdbc:postgresql://localhost:5432/agent_drive
          AGENT_DRIVE_DATABASE_USERNAME: agent_drive
          AGENT_DRIVE_DATABASE_PASSWORD: agent_drive_test
          AGENT_DRIVE_JDBC_TEST_URL: jdbc:postgresql://localhost:5432/agent_drive
          SPRING_FLYWAY_ENABLED: "true"
          SPRING_PROFILES_ACTIVE: db,java-files
          AGENT_DRIVE_CONFIRMATION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          AGENT_DRIVE_LLM_CONFIG_KEY: ZmVkY2JhOTg3NjU0MzIxMGZlZGNiYTk4NzY1NDMyMTA=
        run: mvn -q test

      - name: Java package
        run: mvn -q -DskipTests package

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint (ESLint)
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify static build boundary
        run: npm run verify:build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Build web assets for Capacitor
        working-directory: frontend
        run: npm run build

      - name: Sync Capacitor Android project
        working-directory: frontend
        run: ./node_modules/.bin/capacitor sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Android lint (API compatibility and manifest contract)
        working-directory: frontend/android
        run: ./gradlew lintDebug

      - name: JVM unit tests (migration/checkpoint/config)
        working-directory: frontend/android
        run: ./gradlew testDebugUnitTest
